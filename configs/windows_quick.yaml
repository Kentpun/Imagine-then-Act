# Windows / first-run sanity train: 4-bit + fp16 + tiny subset.
# Use this to verify the loop moves past epoch 1 before a full run.
seed: 42

paths:
  root: .
  raw_dir: data/raw/libero
  processed_dir: data/processed
  frames_dir: data/processed/frames
  output_dir: outputs/windows_quick

data:
  repo_id: lerobot/libero
  backend: hf
  video_key: observation.images.image
  stride: 5
  max_episodes: 50
  val_ratio: 0.1
  move_threshold: 0.01
  lift_threshold: 0.01
  success_near_frames: 15
  image_key_candidates:
    - observation.images.image
    - observation.images.image2
    - observation.image
    - image

model:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  load_in_4bit: true
  freeze_vision: true
  max_pixels: 100352          # ~224*224*2 — much lighter first step
  lora:
    r: 8
    alpha: 16
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

train:
  num_epochs: 1
  batch_size: 1
  grad_accum: 4
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_seq_length: 256
  max_train_samples: 64       # stop after 64 steps for a smoke train
  logging_steps: 5
  save_steps: 50
  eval_steps: 50
  gradient_checkpointing: true
  bf16: false
  fp16: true
  dataloader_num_workers: 0
  resume_from: null

eval:
  checkpoint: outputs/windows_quick/checkpoint-final
  max_samples: 32
  zero_shot_baseline: false

planner:
  grid_xy: [-0.05, 0.0, 0.05]
  dz_values: [0.0]
  gripper_values: [0.0, 1.0]
  max_horizon: 1
  max_candidates: 8

demo:
  host: 127.0.0.1
  port: 8501
  sample_index: 0
