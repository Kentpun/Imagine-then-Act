# Part B — MicroDuck imagination demo (optional; does not replace LIBERO)
seed: 42

paths:
  root: .
  smoke_dir: data/microduck_smoke
  output_dir: outputs/microduck_demo

model:
  # Prefer Part-2 MicroDuck LoRA; LIBERO LoRA remains a fallback.
  model_id: Qwen/Qwen3-VL-2B-Instruct
  checkpoint: outputs/microduck_semantic/checkpoint-final
  load_in_4bit: false
  freeze_vision: true
  # Small pixel budget keeps Mac MPS/CPU ranking usable.
  max_pixels: 100352
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

train:
  bf16: true
  fp16: false
  gradient_checkpointing: true

planner:
  # Sparse set for interactive Mac demos (full grids stay in train/eval configs).
  vx_values: [0.0, 0.15, 0.25]
  vy_values: [0.0]
  yaw_values: [-0.5, 0.0, 0.5]
  max_candidates: 4
  include_kick: false
  max_new_tokens: 24
  replan_every_s: 4.0
  merge_lora: true

mqtt:
  # Point at microduck_demo_part1 .demo/session.env after bootstrap
  enabled: true
  dry_run: false
  session_env: .demo/session.env
  host: broker.emqx.io
  port: 1883
  session_id: null
  duration_s: 3.0
  rate_hz: 10.0

demo:
  host: 127.0.0.1
  port: 8502
  browser_sim: https://huggingface.co/spaces/pollen-robotics/microduck-simulator
