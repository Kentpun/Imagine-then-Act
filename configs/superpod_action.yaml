# HKUST SuperPOD training for a robot-independent action-command LoRA.
# The model learns: image + instruction -> one generic text action command.
# It does not learn MicroDuck velocities, joints, MQTT fields, or push_in.
seed: 42

paths:
  root: .
  raw_dir: data/raw/action
  processed_dir: data/processed_action
  frames_dir: data/processed_action/frames
  output_dir: outputs/superpod_action

data:
  val_ratio: 0.1
  max_rows: 30000
  translation_threshold: 0.003
  sources:
    # Language Table: language instructions with planar object movement.
    # This is the practical default because LeRobot can load episode subsets.
    - name: language_table
      enabled: true
      repo_id: mateoguaman/language_table
      root: data/raw/language_table
      image_key: observation.images.rgb
      max_episodes: 3000
      frames_per_episode: 6

    # BridgeData V2: broader real objects, environments and pushing skills.
    # Disabled by default because the LeRobot v3 package is about 90 GB;
    # enable it only when the SuperPOD project area has enough quota.
    - name: bridge
      enabled: false
      repo_id: nvidia/BridgeData2_LeRobot_v3
      root: data/raw/bridge
      image_key: observation.images.image_0
      max_episodes: 1500
      frames_per_episode: 6

    # LIBERO in LeRobot form. Disabled here because the original project
    # already has a separate LIBERO outcome LoRA and local LIBERO snapshot.
    - name: libero
      enabled: false
      repo_id: lerobot/libero
      root: data/raw/libero_action
      image_key: observation.images.image
      max_episodes: 1200
      frames_per_episode: 6

model:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  load_in_4bit: false
  freeze_vision: false
  max_pixels: 401408
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

train:
  num_epochs: 2
  batch_size: 2
  grad_accum: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_seq_length: 512
  max_train_samples: null
  logging_steps: 20
  save_steps: 500
  eval_steps: 500
  gradient_checkpointing: true
  bf16: true
  fp16: false
  dataloader_num_workers: 8
  resume_from: null

eval:
  checkpoint: outputs/superpod_action/checkpoint-final
  max_samples: 512
  zero_shot_baseline: false
