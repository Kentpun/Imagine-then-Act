# Local Streamlit demo without full LIBERO download.
# Uses smoke frames/labels; keep the trained SuperPOD LoRA checkpoint in the UI.
seed: 42

paths:
  root: .
  raw_dir: data/raw/libero
  processed_dir: data/processed_smoke
  frames_dir: data/processed_smoke/frames
  output_dir: outputs/superpod

data:
  repo_id: lerobot/libero
  backend: hf
  stride: 2
  max_episodes: 8
  val_ratio: 0.2
  move_threshold: 0.01
  lift_threshold: 0.01
  success_near_frames: 8
  image_key_candidates:
    - observation.images.image
    - observation.images.agentview_rgb
    - observation.image
    - image

model:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  load_in_4bit: false
  freeze_vision: false
  max_pixels: 401408
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  bf16: true
  fp16: false
  gradient_checkpointing: true

eval:
  checkpoint: outputs/superpod/checkpoint-final
  max_samples: 64
  zero_shot_baseline: false

planner:
  grid_xy: [-0.05, -0.025, 0.0, 0.025, 0.05]
  dz_values: [0.0, 0.02]
  gripper_values: [0.0, 1.0]
  max_horizon: 1
  max_candidates: 16

demo:
  host: 127.0.0.1
  port: 8501
  sample_index: 0
